# Serves the abc.localhost demo namespace: a landing page plus the
# byoid-configuration well-known document a Verifier fetches to discover this
# namespace's issuer and blind relay.
server {
    listen 80;
    server_name abc.localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The BYOID discovery document. Served as JSON with permissive CORS so a
    # Verifier frontend/backend can fetch it cross-origin.
    location = /.well-known/byoid-configuration {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
