# nginx config for serving the built Vue app and proxying API calls to the
# Go backend. Keeping the frontend and API on one origin avoids CORS in the
# docker-compose setup.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to the backend service defined in docker-compose.
    # (The OAuth callback /login-callback is hit by the browser directly on the
    # backend's published port, so it is not proxied here.)
    location /api/ {
        proxy_pass http://backend:11110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
